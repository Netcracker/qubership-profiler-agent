codecov:
  notify:
    # Three uploads per commit: go and ui from the backend-coverage job, java
    # from build-test. Hold the comment until the last one, or it reports a
    # collapse in coverage against the half of the report that has not landed
    # yet. Bump this together with the number of codecov-action steps.
    after_n_builds: 3

coverage:
  range: "60...100"
  status:
    # The legacy Java tree has never had its coverage measured, so there is no
    # baseline to gate on. Keep both statuses informational until the first runs
    # produce real numbers, then tighten them in a separate commit.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  # carryforward is what keeps a partial upload honest: without it, a pull
  # request that touches no Java at all would report Java coverage as zero in
  # the merged report.
  go:
    carryforward: true
  ui:
    carryforward: true
  java:
    carryforward: true

component_management:
  individual_components:
    - component_id: backend_go
      name: Backend (Go)
      paths:
        # The Go apps are named one by one rather than globbed as
        # `apps/**`, because components are selected by repository path
        # and not by the flag a report arrived under: that glob is a superset of
        # the Backend UI component below, so every TypeScript file would land in
        # both. A new Go app under apps/ has to be added here.
        - "apps/dumps-collector/**"
        - "apps/profiler-backend/**"
        - "libs/**"
        - "tools/**"
    - component_id: backend_ui
      name: Backend UI (TypeScript)
      paths:
        - "apps/ui/src/**"
    - component_id: diagtools
      name: Diagtools (Go)
      paths:
        - "apps/diagtools/**"
    - component_id: java_agent
      name: Java agent
      paths:
        # Defined by subtraction, so every Go and TypeScript tree above has to be
        # named here too. They no longer share a `backend/` prefix to exclude in
        # one line: the Gradle projects and the Go apps are siblings under apps/,
        # so a new Go app has to be added both to backend_go and to this list.
        - "!apps/dumps-collector/**"
        - "!apps/profiler-backend/**"
        - "!apps/ui/**"
        - "!apps/diagtools/**"
        - "!libs/**"
        - "!tools/**"

fixes:
  # `go test -coverprofile` records import paths, not repository paths. The two
  # Go modules have unrelated module paths, so each needs its own rule. The root
  # module maps onto the repository root; the diagtools rule strips its prefix
  # down to the `apps/diagtools/` directory it now lives in.
  - "github.com/Netcracker/qubership-profiler-backend/::"
  - "github.com/Netcracker/qubership-profiler-agent/::apps/"
  # vitest runs from apps/ui, so lcov SF: entries read `src/app.tsx`.
  - "src/::apps/ui/src/"

ignore:
  # Maven-built demo applications, outside both the Gradle and the Go build.
  - "examples/**"
  - "apps/profiler-ui/**"
  - "apps/sample-apps/**"
  - "apps/test-app/**"

comment:
  layout: "header, diff, flags, components"
