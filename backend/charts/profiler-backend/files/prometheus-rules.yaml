# Baseline profiler-backend alerts. This file is the single source: the
# PrometheusRule template embeds it verbatim, and `make rules-test` runs
# `promtool test rules` against it (tests/prometheus/rules_test.yaml).
groups:
  - name: profiler-backend
    rules:
      # A rejected parquet file pins its bucket and every newer bucket in the
      # hot tier (the contiguity barrier, 01 §8). The slow re-test (№2) and the
      # age/size cap shrink the quarantine on their own, so a count that stays
      # non-zero for 15m is one S3 keeps rejecting, and it needs a human.
      - alert: ProfilerStuckQuarantine
        expr: sum by (kind) (profiler_hotstore_quarantine_objects) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Objects stuck in upload quarantine"
          description: "{{ $labels.kind }} objects sit in upload-failed/ awaiting manual resolution; while they wait, hot-tier cleanup behind them is pinned."
      - alert: ProfilerQuarantineAgeHigh
        expr: max by (kind) (profiler_hotstore_quarantine_oldest_age_seconds) > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Upload quarantine unresolved for over an hour"
          description: "The oldest quarantined {{ $labels.kind }} object has waited over an hour; the collector PV keeps accumulating state it cannot release."
      # The segment budget only covers part of the PV (04 §3.5); nearing it
      # means evictions (data loss as truncated_reason=disk_budget) are close.
      - alert: ProfilerDiskBudgetNearFull
        expr: >-
          profiler_hotstore_segments_disk_bytes
            / profiler_hotstore_segments_disk_budget_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hot-store segments near the disk budget"
          description: "Segment files exceed 90% of PROFILER_CHUNKS_STAGING_MAX_BYTES; the janitor will start evicting segments and calls will seal with truncated_reason=disk_budget."
      # The oldest hot row should age out at hot_retention (15m default); a
      # lag far past it means the seal→upload→drop pipeline is stuck (a
      # quarantined upload pins everything newer, 02 §4.3).
      - alert: ProfilerHotWindowLagHigh
        expr: profiler_hotstore_hot_window_lag_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hot window is not draining"
          description: "The oldest row in the hot index is over 30 minutes old — twice the default hot retention. The hot→cold handoff (seal, upload, or janitor drop) is stuck."
      # The ingest gate refuses agent data with ACK_ERROR once the pending
      # backlog (parquet + partitions + WALs) fills the budget (01 §4.6). The
      # agent does not buffer and retry: it drops the refused window and
      # reconnects, so any refused bytes are data lost right now — usually
      # because S3 stopped draining the backlog.
      - alert: ProfilerIngestRefused
        expr: increase(profiler_ingest_refused_bytes_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Collector is refusing agent data — the agent drops it"
          description: "The backpressure gate answered ACK_ERROR to agent RCV_DATA; the agent drops the refused window and reconnects, so this data is lost. Check S3 upload health and PROFILER_PENDING_UPLOAD_MAX_BYTES."
      # The share of failed S3 PUTs, parquet bodies and manifests together.
      # The counters move as each PUT starts and fails, so a pass stuck in a
      # long S3 outage still shows up. With no attempts the ratio is NaN and
      # the alert stays quiet.
      - alert: ProfilerUploadFailures
        expr: >-
          sum without (object, reason) (rate(profiler_upload_put_failures_total[10m]))
            / sum without (object) (rate(profiler_upload_put_attempts_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "S3 uploads are failing"
          description: "More than 10% of S3 PUT attempts failed over the last 10 minutes; pending parquet stays on the PV and retries with backoff."
      # A permanent rejection (a 4xx) does not heal by retrying: the object
      # moves to upload-failed/ and waits for the slow re-test or a human.
      - alert: ProfilerUploadRejected
        expr: >-
          sum without (object, reason) (increase(profiler_upload_put_failures_total{reason="permanent"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "S3 rejects uploads permanently"
          description: "S3 rejected a PUT with an error retrying cannot fix; the object went to upload-failed/. Check the bucket permissions and policy."
      # The share of failed passes per loop. A single failed pass is transient
      # (the loop retries on the next tick); a loop that fails more than half
      # of its passes is wedged, whatever its check interval.
      - alert: ProfilerLoopErrors
        expr: >-
          (
            label_replace(
              increase(profiler_seal_loop_errors_total[15m])
                / clamp_min(increase(profiler_seal_passes_total[15m]), 1),
              "loop", "seal", "", "")
            or label_replace(
              increase(profiler_upload_loop_errors_total[15m])
                / clamp_min(increase(profiler_upload_passes_total[15m]), 1),
              "loop", "upload", "", "")
            or label_replace(
              increase(profiler_janitor_loop_errors_total[15m])
                / clamp_min(increase(profiler_janitor_passes_total[15m]), 1),
              "loop", "janitor", "", "")
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A collector maintenance loop keeps failing"
          description: "The {{ $labels.loop }} loop failed more than half of its passes over the last 15 minutes; the hot→cold handoff may be stalling."
      # The upload queue should drain within a few upload intervals. A pending
      # file older than 30 minutes means the uploader cannot keep up or is
      # blocked, and the PV keeps accumulating sealed parquet.
      - alert: ProfilerUploadBacklogStale
        expr: profiler_upload_lag_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sealed parquet is not reaching S3"
          description: "The oldest pending upload has waited over 30 minutes; upload_backlog is not draining and the collector PV keeps growing."
      # Compaction splits oversized groups (№11), so the only object it ever
      # skips is a SINGLE file larger than the whole PROFILER_COMPACTION_MAX_BYTES
      # budget — it will be re-skipped on every pass and its bucket never
      # converges. Raise the budget or investigate the producer.
      - alert: ProfilerCompactionOversizedObject
        expr: increase(profiler_maintain_skipped_groups_total{reason="oversized"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A parquet object exceeds the compaction budget"
          description: "maintain skipped an object bigger than PROFILER_COMPACTION_MAX_BYTES; its (bucket, class) group cannot converge until the budget is raised."
