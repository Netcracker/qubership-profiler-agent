name: Dependency Submission

# See https://github.com/gradle/actions/blob/768a17f3488dc3fe0155ff431553e1f53d57e22e/dependency-submission/README.md#the-dependency-submission-action
# The action allows GitHub to alert about reported vulnerabilities in the project
on:
  push:
    branches:
      - main

# Declare default permissions as read-only.
permissions: read-all

jobs:
  dependency-submission:
    name: Submit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: zulu
        java-version: 21
        server-id: central
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Profiler plugins do not expose the dependencies to the runtime, so the versions used for the build
        # do not affect the execution. At the same time, we might need to build plugins for different thirdparty
        # versions, so we intentionally exclude :plugins:* projects from the submitted dependencies.
        # :sample-apps:* are pinned to specific framework majors (e.g. Spring Boot 3.x) on purpose and should not
        # generate security alerts for the profiler agent project.
        # Gradle project paths stay flat even though their directories live under apps/agent/.
        # Exclude test applications, support libraries, and benchmarks as well.
        dependency-graph-exclude-projects: |
          :(plugins(:.*)?|sample-apps(:.*)?|benchmarks|bom-testing|installer-zip-test|it-.*|jcstress-jupiter-engine|mock-collector|plugin-testkit|test.*)
        # Tests in production modules also resolve dependencies from test support projects.
        dependency-graph-exclude-configurations: '(?i).*test.*'
