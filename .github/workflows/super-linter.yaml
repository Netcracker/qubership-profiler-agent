# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/super-linter/super-linter
# Configuration file for super-linter example:
# .github/super-linter.env
# Configuration files for individual linters should be placed in .github/linters

name: Lint Code Base

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false
        description: "Lint all codebase"
permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: "Get the common linters configuration"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # fix/superlinter-config
          repository: netcracker/.github
          path: netcracker.github/
          persist-credentials: false
          sparse-checkout: |
            config/linters

      - name: "Apply the common linters configuration"
        run: |
          ls -l netcracker.github/config/linters
          mkdir -p .github/linters
          cp --update=none -vR netcracker.github/config/linters/ .github/
          rm -rf netcracker.github/

      - name: "Load super-linter environment file"
        shell: bash
        # language=bash
        run: |
          # Skip comments, blank lines, and removed linters from the shared configuration.
          cat .github/linters/super-linter.env .github/super-linter.env |
            grep -vE '^(#|[[:space:]]*$|VALIDATE_(TERRAFORM_TERRASCAN|JUPYTER_NBQA_(BLACK|FLAKE8|ISORT|MYPY|PYLINT|RUFF))=)' >> "$GITHUB_ENV"

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: apps/agent/it-e2e/yarn.lock

      - name: Install it-e2e dependencies
        # SuperLiner doesn't install JS dependencies before executing linters, so we need to do it manually
        shell: bash
        # language=bash
        run: yarn --cwd apps/agent/it-e2e install --fronzen-lockfile

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.full_scan || false }}
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref }}
