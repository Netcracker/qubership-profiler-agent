name: Spell Check

on:
  pull_request:
    paths:
      - '**.java'
      - '**.kt'
      - '**.kts'
      - '**.md'
      - '**.txt'
      - '**.yaml'
      - '**.yml'
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  misspell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run misspell with reviewdog
        uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784 # v1.30.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          locale: "US"
          ignore: "cancelled,analyse"
          level: "warning"
          reporter: "github-pr-review"
          filter_mode: "diff_context"
          fail_level: "error"
          exclude: |
            ./.git/*
            ./node_modules/*
            ./.gradle/*
            ./build/*
            ./*/build/*
            ./profiler-ui/node_modules/*
            ./.agents/*
            ./.claude/*
            ./.codex/*
            ./.cursor/*
          pattern: |
            *.java
            *.kt
            *.kts
            *.md
            *.txt
            *.yaml
            *.yml
