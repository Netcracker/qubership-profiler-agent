name: Auto Release

# Starts the Release workflow on main when a security fix has landed since the latest release,
# or when about a month has passed since the latest release.
on:
  schedule:
    # Mondays, after the Sunday run of security-scan.yml has refreshed the code scanning alerts
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the decision without starting the Release workflow
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  decide-and-release:
    name: Decide whether to release
    if: ${{ github.repository == 'Netcracker/qubership-profiler-agent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # starts release.yaml and checks whether a release run is in progress
      actions: write
      # reads code scanning alerts and analyses
      security-events: read
      # reads Dependabot alerts
      vulnerability-alerts: read
    steps:
      - name: Decide and start the Release workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run == true }}
          RELEASE_BRANCH: main
          RELEASE_WORKFLOW: release.yaml
        with:
          # language=javascript
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const branch = process.env.RELEASE_BRANCH;
            const workflowId = process.env.RELEASE_WORKFLOW;
            const now = new Date();
            const HOUR = 3600 * 1000;
            const DAY = 24 * HOUR;

            const { data: latest } = await github.rest.repos.getLatestRelease({ owner, repo });
            const releasedAt = new Date(latest.published_at);
            core.info(`Latest release: ${latest.tag_name}, published at ${latest.published_at}`);

            // release.yaml pushes "chore: bump version to x.y.z" after the tag, so that commit alone is no change
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${latest.tag_name}...${branch}`,
            });
            const changes = comparison.commits
              .filter(c => !c.commit.message.startsWith('chore: bump version to '));
            const hasChanges = changes.length > 0 || comparison.ahead_by > comparison.commits.length;
            core.info(`Commits on ${branch} since ${latest.tag_name}: ${comparison.ahead_by}, excluding version bumps: ${changes.length}`);

            // A Dependabot alert is fixed once the manifest on the default branch no longer has the vulnerable version.
            // Moving a manifest also fixes its alerts and opens the same ones at the new path, so an advisory that is
            // still open for the same package does not count. Development dependencies do not ship.
            const dependabotFixed = await github.paginate(github.rest.dependabot.listAlertsForRepo,
              { owner, repo, state: 'fixed', per_page: 100 });
            const dependabotOpen = await github.paginate(github.rest.dependabot.listAlertsForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const dependabotKey = a => `${a.security_advisory.ghsa_id} ${a.dependency.package.ecosystem}:${a.dependency.package.name}`;
            const stillOpen = new Set(dependabotOpen.map(dependabotKey));
            const dependabotFixes = dependabotFixed.filter(a =>
              new Date(a.fixed_at) > releasedAt
              && a.dependency.scope !== 'development'
              && !stillOpen.has(dependabotKey(a)));

            // security-scan.yml scans the image built by the latest release, so the first scan after a release
            // fixes the alerts that the release itself resolved. Those fixes are already released and do not count.
            const analyses = await github.paginate(github.rest.codeScanning.listRecentAnalyses,
              { owner, repo, ref: `refs/heads/${branch}`, per_page: 100 },
              (response, done) => {
                if (response.data.some(a => new Date(a.created_at) <= releasedAt)) done();
                return response.data;
              });
            const firstScanAfterRelease = new Map();
            for (const a of analyses) {
              const createdAt = new Date(a.created_at);
              if (createdAt <= releasedAt) continue;
              const key = `${a.tool.name} ${a.category}`;
              if (!firstScanAfterRelease.has(key) || createdAt < firstScanAfterRelease.get(key)) {
                firstScanAfterRelease.set(key, createdAt);
              }
            }
            // The scan uploads one analysis per image tag, a few minutes apart
            const SCAN_RUN_DURATION = HOUR;
            const codeScanningFixed = await github.paginate(github.rest.codeScanning.listAlertsForRepo,
              { owner, repo, state: 'fixed', ref: `refs/heads/${branch}`, per_page: 100 });
            const codeScanningFixes = codeScanningFixed.filter(a => {
              const fixedAt = new Date(a.fixed_at);
              // Scorecard reports repository settings, and a rule without security_severity_level is no vulnerability
              if (fixedAt <= releasedAt || a.tool.name === 'Scorecard' || !a.rule.security_severity_level) return false;
              const firstScan = firstScanAfterRelease.get(`${a.tool.name} ${a.most_recent_instance.category}`);
              return !firstScan || fixedAt.getTime() > firstScan.getTime() + SCAN_RUN_DURATION;
            });

            // The workflow runs weekly, so a release is due on the run nearest to the monthly anniversary.
            // Waiting for the first run after the anniversary would stretch the interval towards five weeks.
            const anniversary = new Date(releasedAt);
            anniversary.setUTCMonth(anniversary.getUTCMonth() + 1);
            const monthElapsed = now.getTime() >= anniversary.getTime() - 3.5 * DAY;

            const { data: runs } = await github.rest.actions.listWorkflowRuns(
              { owner, repo, workflow_id: workflowId, per_page: 20 });
            const releaseRunning = runs.workflow_runs.some(r => r.status !== 'completed');

            let decision;
            if (!hasChanges) {
              decision = `skip: ${branch} has no changes since ${latest.tag_name}`;
            } else if (releaseRunning) {
              decision = `skip: a ${workflowId} run is in progress`;
            } else if (dependabotFixes.length > 0 || codeScanningFixes.length > 0) {
              decision = 'release: security fixes since the latest release';
            } else if (monthElapsed) {
              decision = `release: a month has passed since ${latest.tag_name}`;
            } else {
              decision = `skip: no security fixes, next monthly release is due around ${anniversary.toISOString().slice(0, 10)}`;
            }
            core.info(`Decision: ${decision}`);

            const fixRows = [
              ...dependabotFixes.map(a => ['Dependabot', `#${a.number}`, a.security_advisory.severity,
                `${a.dependency.package.name} (${a.dependency.manifest_path})`, a.fixed_at]),
              ...codeScanningFixes.map(a => [a.tool.name, `#${a.number}`, a.rule.security_severity_level,
                `${a.rule.id} (${a.most_recent_instance.category})`, a.fixed_at]),
            ];
            await core.summary
              .addHeading('Auto release', 2)
              .addRaw(`Latest release: ${latest.tag_name}, published at ${latest.published_at}`, true)
              .addRaw(`Commits since the release, excluding version bumps: ${changes.length}`, true)
              .addRaw(`Decision: ${decision}${dryRun ? ' (dry run)' : ''}`, true)
              .addTable([
                [{ data: 'Source', header: true }, { data: 'Alert', header: true }, { data: 'Severity', header: true },
                  { data: 'Subject', header: true }, { data: 'Fixed at', header: true }],
                ...fixRows,
              ])
              .write();

            if (!decision.startsWith('release:') || dryRun) return;
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflowId, ref: branch });
            core.info(`Started ${workflowId} on ${branch}`);
