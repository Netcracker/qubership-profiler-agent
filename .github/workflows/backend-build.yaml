---
name: Backend Build

on:
  push:
    branches-ignore:
      - 'renovate/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yaml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: apps-build
        # language=bash
        run: make apps-build

      # Tests live in the backend-coverage job of build.yaml, where a single
      # `go test ./...` from the module root covers apps/**, libs/** and tools/**
      # and feeds the coverage profile to Codecov. This workflow stays a fast
      # compile check on branch pushes.

      - name: tools-build
        # language=bash
        run: make tools-build

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1 --verify=false

      - name: Run dumps-collector Helm unit tests
        run: helm unittest charts/dumps-collector

# TODO: fix Helm violations like "name is required", "apiVersion is required", ...
#      - name: charts-build
#        # language=bash
#        run: make charts-build

      - name: examples-build
        # language=bash
        run: make examples-build

      - name: delivery-build
        # language=bash
        run: make delivery-build
