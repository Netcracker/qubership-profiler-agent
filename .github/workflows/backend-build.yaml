---
name: Backend Build

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dumps-collector/**'
      - 'apps/profiler-backend/**'
      - 'apps/ui/**'
      - 'apps/Makefile'
      - 'libs/**'
      - 'tools/**'
      - 'deploy/**'
      - 'apps/examples/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'docker-compose.yaml'
      - '.github/workflows/backend-build.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/dumps-collector/**'
      - 'apps/profiler-backend/**'
      - 'apps/ui/**'
      - 'apps/Makefile'
      - 'libs/**'
      - 'tools/**'
      - 'deploy/**'
      - 'apps/examples/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'docker-compose.yaml'
      - '.github/workflows/backend-build.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'maven'

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: apps-build
        # language=bash
        run: make apps-build

      # Tests live in the backend-coverage job of build.yaml, where a single
      # `go test ./...` from the module root covers apps/**, libs/** and tools/**
      # and feeds the coverage profile to Codecov. This workflow stays a fast
      # compile check on pull requests and on pushes to main.

      - name: tools-build
        # language=bash
        run: make tools-build

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1 --verify=false

      - name: Run dumps-collector Helm unit tests
        run: helm unittest deploy/charts/dumps-collector

# TODO: fix Helm violations like "name is required", "apiVersion is required", ...
#      - name: charts-build
#        # language=bash
#        run: make charts-build

      - name: examples-build
        # language=bash
        run: make examples-build

      - name: delivery-build
        # language=bash
        run: make delivery-build
