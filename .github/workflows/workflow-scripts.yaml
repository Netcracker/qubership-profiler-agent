name: Workflow Scripts

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'
      - '.github/workflows/workflow-scripts.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/scripts/**'
      - '.github/workflows/workflow-scripts.yaml'

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the workflow scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # actions/github-script v9 runs on Node 24
          node-version: 24

      - name: Run the tests
        run: node --test --test-randomize .github/scripts/
