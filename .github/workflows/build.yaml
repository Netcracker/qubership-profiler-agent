name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# Every job here only reads the repository: checkout, the language toolchains,
# Gradle, and the Codecov uploads, which authenticate with CODECOV_TOKEN rather
# than through OIDC. upload-artifact needs no scope of its own, since v4 and
# later authenticate against the artifact service with the Actions runtime token.
permissions:
  contents: read

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Runs alongside build-test rather than feeding it: Codecov merges every upload
  # for a commit server-side, so the two jobs stay independent.
  backend-coverage:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # backend/go.mod pins the newer toolchain of the two modules, so it
          # builds diagtools as well.
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            diagtools/go.sum
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/apps/ui/package-lock.json
      # One `go test ./...` from the module root covers apps/**, libs/** and
      # tools/**. Legacy parser/generator tests that depend on uncommitted
      # captured fixtures skip themselves on a clean checkout (see WORKFLOW.md §6).
      - name: Go tests with coverage
        working-directory: backend
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      # diagtools is the repository's other Go module, with its own go.mod and
      # no go.work, so the run above never reaches it. Zig is not needed here:
      # it is the cross-compiling C toolchain from diagtools/Makefile, and these
      # tests build for the host.
      - name: diagtools tests with coverage
        working-directory: diagtools
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Install UI dependencies
        working-directory: backend/apps/ui
        # language=bash
        run: npm ci
      - name: UI tests with coverage
        working-directory: backend/apps/ui
        # language=bash
        run: npm run test:coverage
      # Codecov refuses a tokenless upload once the branch is protected, so
      # CODECOV_TOKEN is what keeps these steps green. A pull request from a fork
      # sees an empty token, because GitHub withholds secrets from those runs;
      # a tokenless upload from a public repository is still accepted there.
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: backend/coverage.out,diagtools/coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true
      - name: Upload UI coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: backend/apps/ui/coverage/lcov.info
          flags: ui
          disable_search: true
          fail_ci_if_error: true

  build-test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_USER }} # zizmor: ignore[secrets-outside-env]
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Checkout qubership-core-base-images
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Netcracker/qubership-core-base-images
          path: installer/build/git/qubership-core-base-images
          fetch-depth: 50
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
          server-id: central
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: diagtools/go.mod
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/apps/ui/package-lock.json
      - name: Validate UI lock file
        # This required Test check catches package.json/lockfile drift before merge;
        # the non-required coverage job installs the same lock file later.
        working-directory: backend/apps/ui
        run: npm ci --dry-run --no-audit --no-fund
      - name: Setup Zig
        # Zig is used as the cgo C compiler for cross-compiling diagtools
        # (linux/amd64, linux/arm64, windows/amd64) — see diagtools/Makefile.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Test
        uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5 # v3.0.2
        with:
          multi-cache-enabled: false
          arguments: --scan --no-parallel -Pcoverage build jacocoReport
      - name: Upload Java coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: build/reports/jacoco/jacocoReport/jacocoReport.xml
          flags: java
          disable_search: true
          fail_ci_if_error: true
      - name: Upload it-e2e diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: it-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            it-e2e/playwright-report/**
            it-e2e/test-results/**
            it-e2e/build/test-dump/**
            it-e2e/config/**
      - name: Publish snapshots
        uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5 # v3.0.2
        if: ${{ env.CENTRAL_PORTAL_USERNAME != '' }}
        with:
          arguments: publishAllPublicationsToCentralSnapshotsRepository
          properties: | # zizmor: ignore[secrets-outside-env]
            centralSnapshotsUsername=${{ secrets.MAVEN_USER }}
            centralSnapshotsPassword=${{ secrets.MAVEN_PASSWORD }}
