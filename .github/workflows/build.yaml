name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# Test jobs execute repository code with read-only contents permission. A
# separate uploader reads the checked-out repository and coverage artifacts, then
# uses OIDC for Codecov. Artifact actions authenticate with the Actions runtime token.
permissions:
  contents: read

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Runs alongside build-test and publishes coverage reports for the isolated
  # uploader job. Codecov merges its three uploads for each commit server-side.
  backend-coverage:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # backend/go.mod pins the newer toolchain of the two modules, so it
          # builds diagtools as well.
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            diagtools/go.sum
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/apps/ui/package-lock.json
      # One `go test ./...` from the module root covers apps/**, libs/** and
      # tools/**. Legacy parser/generator tests that depend on uncommitted
      # captured fixtures skip themselves on a clean checkout (see WORKFLOW.md §6).
      - name: Go tests with coverage
        working-directory: backend
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      # diagtools is the repository's other Go module, with its own go.mod and
      # no go.work, so the run above never reaches it. Zig is not needed here:
      # it is the cross-compiling C toolchain from diagtools/Makefile, and these
      # tests build for the host.
      - name: diagtools tests with coverage
        working-directory: diagtools
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Install UI dependencies
        working-directory: backend/apps/ui
        # language=bash
        run: npm ci
      - name: UI tests with coverage
        working-directory: backend/apps/ui
        # language=bash
        run: npm run test:coverage
      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-go
          path: |
            backend/coverage.out
            diagtools/coverage.out
      - name: Upload UI coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-ui
          path: backend/apps/ui/coverage/lcov.info

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_USER }} # zizmor: ignore[secrets-outside-env]
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Checkout qubership-core-base-images
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Netcracker/qubership-core-base-images
          path: installer/build/git/qubership-core-base-images
          fetch-depth: 50
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
          server-id: central
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: diagtools/go.mod
      - name: Setup Zig
        # Zig is used as the cgo C compiler for cross-compiling diagtools
        # (linux/amd64, linux/arm64, windows/amd64) — see diagtools/Makefile.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Test
        uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5 # v3.0.2
        with:
          multi-cache-enabled: false
          arguments: --scan --no-parallel -Pcoverage build jacocoReport
      - name: Upload Java coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-java
          path: build/reports/jacoco/jacocoReport/jacocoReport.xml
      - name: Upload it-e2e diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ failure() }}
        with:
          name: it-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            it-e2e/playwright-report/**
            it-e2e/test-results/**
            it-e2e/build/test-dump/**
            it-e2e/config/**
      - name: Publish snapshots
        uses: burrunan/gradle-cache-action@4b67497abd37a511d6c1dc6299bdd84ff39f7bf5 # v3.0.2
        if: ${{ env.CENTRAL_PORTAL_USERNAME != '' }}
        with:
          arguments: publishAllPublicationsToCentralSnapshotsRepository
          properties: | # zizmor: ignore[secrets-outside-env]
            centralSnapshotsUsername=${{ secrets.MAVEN_USER }}
            centralSnapshotsPassword=${{ secrets.MAVEN_PASSWORD }}

  codecov-upload:
    name: Upload coverage to Codecov
    needs: [backend-coverage, build-test]
    if: ${{ !cancelled() && needs.backend-coverage.result == 'success' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # codecov-action v7 requires a checkout for repository metadata. This job
      # does not run repository commands, and checkout leaves no credentials.
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download Go coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-go
          path: coverage-reports/go
      - name: Download UI coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-ui
          path: coverage-reports/ui
      - name: Download Java coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-java
          path: coverage-reports/java
      # Codecov omits OIDC for fork pull requests and retains its tokenless
      # public-repository upload path for them.
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage-reports/go/backend/coverage.out,coverage-reports/go/diagtools/coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true
      - name: Upload UI coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage-reports/ui/lcov.info
          flags: ui
          disable_search: true
          fail_ci_if_error: true
      - name: Upload Java coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage-reports/java/jacocoReport.xml
          flags: java
          disable_search: true
          fail_ci_if_error: true

  # Keep the required Test context tied to every test and coverage outcome.
  ci-gate:
    name: Test
    needs: [backend-coverage, build-test, codecov-upload]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify CI jobs
        if: ${{ needs.backend-coverage.result != 'success' || needs.build-test.result != 'success' || needs.codecov-upload.result != 'success' }}
        # language=bash
        run: exit 1
