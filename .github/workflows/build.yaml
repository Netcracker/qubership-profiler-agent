name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# Every job here only reads the repository: checkout, the language toolchains,
# Gradle, and the Codecov uploads, which authenticate with CODECOV_TOKEN rather
# than through OIDC. upload-artifact needs no scope of its own, since v4 and
# later authenticate against the artifact service with the Actions runtime token.
# The job that publishes snapshots to GitHub Packages adds packages: write.
permissions:
  contents: read

concurrency:
  # On main, we don't want any jobs cancelled so the sha is used to name the group:
  # a cancelled snapshot upload to GitHub Packages leaves a partial publication behind.
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  # Runs alongside build-test rather than feeding it: Codecov merges every upload
  # for a commit server-side, so the two jobs stay independent.
  backend-coverage:
    name: Backend tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod pins the newer toolchain of the two modules, so it
          # builds diagtools as well.
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            apps/agent/diagtools/go.sum
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      # One `go test ./...` from the repository root covers apps/**, libs/** and
      # tools/**. Legacy parser/generator tests that depend on uncommitted
      # captured fixtures skip themselves on a clean checkout (see WORKFLOW.md §6).
      - name: Go tests with coverage
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      # diagtools is the repository's other Go module, with its own go.mod and
      # no go.work, so the run above never reaches it. Zig is not needed here:
      # it is the cross-compiling C toolchain from apps/agent/diagtools/Makefile, and these
      # tests build for the host.
      - name: diagtools tests with coverage
        working-directory: apps/agent/diagtools
        # language=bash
        run: go test ./... -covermode=atomic -coverprofile=coverage.out
      - name: Install UI dependencies
        working-directory: apps/ui
        # language=bash
        run: npm ci
      - name: UI tests with coverage
        working-directory: apps/ui
        # language=bash
        run: npm run test:coverage
      # Codecov refuses a tokenless upload once the branch is protected, so
      # CODECOV_TOKEN is what keeps these steps green. A pull request from a fork
      # sees an empty token, because GitHub withholds secrets from those runs;
      # a tokenless upload from a public repository is still accepted there.
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: coverage.out,apps/agent/diagtools/coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true
      - name: Upload UI coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: apps/ui/coverage/lcov.info
          flags: ui
          disable_search: true
          fail_ci_if_error: true

  build-test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_USER }} # zizmor: ignore[secrets-outside-env]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false
      - name: Checkout qubership-core-base-images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-core-base-images
          path: apps/agent/installer/build/git/qubership-core-base-images
          fetch-depth: 50
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
          server-id: central
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/diagtools/go.mod
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Validate UI lock file
        # This required Test check catches package.json/lockfile drift before merge;
        # the non-required coverage job installs the same lock file later.
        working-directory: apps/ui
        run: npm ci --dry-run --no-audit --no-fund
      - name: Setup Zig
        # Zig is used as the cgo C compiler for cross-compiling diagtools
        # (linux/amd64, linux/arm64, windows/amd64) — see apps/agent/diagtools/Makefile.
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Test
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
        with:
          multi-cache-enabled: false
          arguments: --scan --no-parallel -Pcoverage build jacocoReport
      - name: Upload Java coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: build/reports/jacoco/jacocoReport/jacocoReport.xml
          flags: java
          disable_search: true
          fail_ci_if_error: true
      - name: Upload it-e2e diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: it-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/agent/it-e2e/playwright-report/**
            apps/agent/it-e2e/test-results/**
            apps/agent/it-e2e/build/test-dump/**
            apps/agent/it-e2e/config/**
      - name: Publish snapshots
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
        if: ${{ env.CENTRAL_PORTAL_USERNAME != '' && vars.PUBLISH_TO_CENTRAL != 'false' }}
        with:
          arguments: publishAllPublicationsToCentralSnapshotsRepository
          properties: | # zizmor: ignore[secrets-outside-env]
            centralSnapshotsUsername=${{ secrets.MAVEN_USER }}
            centralSnapshotsPassword=${{ secrets.MAVEN_PASSWORD }}

  # A job of its own, so that the Test job, which also runs pull request code, keeps a read-only token.
  publish-github-packages-snapshots:
    name: Publish snapshots to GitHub Packages
    needs: build-test
    if: ${{ github.event_name == 'push' && vars.PUBLISH_TO_GITHUB_PACKAGES == 'true' }}
    # Runs on main do not cancel each other, so the uploads take turns:
    # two concurrent uploads would read the same snapshot build number from the registry.
    concurrency:
      group: publish-github-packages-snapshots
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout qubership-core-base-images
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Netcracker/qubership-core-base-images
          path: apps/agent/installer/build/git/qubership-core-base-images
          fetch-depth: 50
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/agent/diagtools/go.mod
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Publish snapshots to GitHub Packages
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
        with:
          arguments: publishAggregationToGithubPackages
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
