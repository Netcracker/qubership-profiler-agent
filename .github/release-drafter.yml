name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Categories are evaluated top to bottom, and every changelog category is
# exclusive, so each pull request lands in the first category it matches.
categories:
  - title: "💥 Breaking Changes"
    exclusive: true
    when:
      label: breaking-change
  # Component-scoped categories require both the component label and the type
  # label, so they must come before the catch-all categories below.
  - title: "Agent - New Features"
    exclusive: true
    when:
      labels:
        - "component: agent"
        - enhancement
      labels-mode: all
  - title: "Agent - Bug Fixes"
    exclusive: true
    when:
      labels:
        - "component: agent"
        - fix
      labels-mode: all
  - title: "Dumps Collector - New Features"
    exclusive: true
    when:
      labels:
        - "component: dumps-collector"
        - enhancement
      labels-mode: all
  - title: "Dumps Collector - Bug Fixes"
    exclusive: true
    when:
      labels:
        - "component: dumps-collector"
        - fix
      labels-mode: all
  - title: "Diagtools - New Features"
    exclusive: true
    when:
      labels:
        - "component: diagtools"
        - enhancement
      labels-mode: all
  - title: "Diagtools - Bug Fixes"
    exclusive: true
    when:
      labels:
        - "component: diagtools"
        - fix
      labels-mode: all
  # Catch-all for PRs without component labels
  - title: "💡 New Features"
    exclusive: true
    when:
      label: enhancement
  - title: "🐞 Bug Fixes"
    exclusive: true
    when:
      label: fix
  - title: "📝 Documentation"
    exclusive: true
    when:
      label: documentation
  - title: "⚙️ Technical Debt"
    exclusive: true
    when:
      label: refactor
  - title: "🧰 Maintenance"
    exclusive: true
    when:
      label: chore
  - title: "⬆️ Dependencies"
    collapse-after: 8
    exclusive: true
    when:
      label: dependencies

  # Version resolution. A release without any of these labels gets a patch bump.
  - type: version-resolver
    semver-increment: major
    when:
      label: major
  - type: version-resolver
    semver-increment: minor
    when:
      label: minor
  - type: version-resolver
    semver-increment: patch
    when:
      label: patch

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
no-changes-template: "No significant changes"

template: |
  ## 🚀 Release

  ### What's Changed
  $CHANGES

  **Contributors:** $CONTRIBUTORS

# See https://github.com/release-drafter/release-drafter#autolabeler
# Since v7 the autolabeler is a separate action (release-drafter/release-drafter/autolabeler),
# so this section only takes effect once a workflow runs that action.
autolabeler:
  - label: 'dependencies'
    files:
      - 'gradle-wrapper.properties'
    title:
      - '/^fix\(deps\)/i'
      - '/^chore:\s*bump/i'
  - label: 'chore'
    files:
      - '*gradle*'
      - '.github/**'
    branch:
      - '/docs{0,1}\/.+/'
    title:
      - '/^chore/i'
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix/i'
  - label: 'enhancement'
    branch:
      - '/feature\/.+/'
    title:
      - '/^feat/i'
