# OrbStack localdev values for deploy/charts/profiler-backend. Differences from
# kind: the agent Service is a LoadBalancer (OrbStack ships a built-in LB, so
# the collector's TCP port gets a host-reachable IP), and images need no
# `kind load` — OrbStack's k8s shares the host Docker daemon.
#
#   docker build -f apps/profiler-backend/Dockerfile -t profiler-backend:dev backend
#   helm dependency update deploy/charts/profiler-backend
#   helm install profiler deploy/charts/profiler-backend -f deploy/kind/values-orbstack.yaml

collector:
  replicas: 1
  storage:
    # storageClassName stays empty: OrbStack's default class.
    size: 5Gi
  # See values-kind.yaml: the budget must stay well under the PVC (04 §3.5).
  chunksStagingMaxBytes: 1GB
  terminationGracePeriodSeconds: 30
  agentService:
    type: LoadBalancer
  env:
    PROFILER_SEAL_CHECK_INTERVAL: 2s
    PROFILER_UPLOAD_CHECK_INTERVAL: 2s
    PROFILER_SHUTDOWN_DRAIN_GRACE: 1s

query:
  replicas: 1
  env:
    PROFILER_SHUTDOWN_DRAIN_GRACE: 1s

maintain:
  mode: deployment
  checkInterval: 1m

seaweedfs:
  enabled: true
  s3:
    credentials:
      admin:
        accessKey: &s3AccessKey profiler
        secretKey: &s3SecretKey profiler-secret

# The profiler workloads sign in as the SeaweedFS admin identity above.
s3:
  auth:
    accessKey: *s3AccessKey
    secretKey: *s3SecretKey
